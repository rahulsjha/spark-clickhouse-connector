name: fork-check-609
on:
  push:
    branches: [ci/609-transient]
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { spark: '3.3', scala: '2.12', java: 8, variant: fixed }
          - { spark: '4.1', scala: '2.13', java: 17, variant: fixed }
          - { spark: '4.1', scala: '2.13', java: 17, variant: unfixed }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Without @transient
        if: matrix.variant == 'unfixed'
        run: sed -i 's/@transient private lazy val utcDateTimeFmt/private lazy val utcDateTimeFmt/' spark-${{ matrix.spark }}/clickhouse-spark/src/main/scala/com/clickhouse/spark/SQLHelper.scala && git diff --stat
      - name: SQLHelperSuite
        run: >-
          ./gradlew --no-daemon
          -Dscala_binary_version=${{ matrix.scala }}
          -Dspark_binary_version=${{ matrix.spark }}
          :clickhouse-spark-${{ matrix.spark }}_${{ matrix.scala }}:test --tests com.clickhouse.spark.SQLHelperSuite
      - name: Results
        if: always()
        run: |
          for f in spark-${{ matrix.spark }}/clickhouse-spark/build/test-results/test/*.xml; do grep -o '<testsuite [^>]*>' "$f"; grep -B1 -A3 '<failure' "$f" | head -20; done
  style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - run: ./gradlew spotlessCheck --no-daemon
